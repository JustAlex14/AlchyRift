# Copies docs/wiki to this repository's GitHub wiki whenever those pages change on main.
# The wiki must be turned on (Settings > Features > Wikis) and have at least one page saved from the GitHub
# website once, so that its git repository exists. After that this runs on its own.
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docs/wiki into the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "Alex"
          git config user.email "alexis.gabriel.manso@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -m "Update wiki from docs/wiki at ${GITHUB_SHA::7}"
          git push
